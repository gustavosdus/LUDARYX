name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore LUDARYX
        run: dotnet restore UnifiedGameLauncher.csproj

      - name: Restore updater
        run: dotnet restore Updater/LUDARYX.Updater.csproj

      - name: Build LUDARYX
        run: dotnet build UnifiedGameLauncher.csproj -c Release --no-restore

      - name: Build updater
        run: dotnet build Updater/LUDARYX.Updater.csproj -c Release --no-restore
