name: Relatar um bug
description: Informe um problema reproduzível no LUDARYX
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Versão do LUDARYX
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste os passos mínimos necessários.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento observado
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs ou capturas
      description: Revise os arquivos antes de anexá-los e remova dados pessoais que não queira compartilhar.
  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Removi API keys, tokens, senhas e outros segredos do material anexado.
          required: true
